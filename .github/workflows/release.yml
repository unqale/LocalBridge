name: Release

# Runs when you push a version tag.
on:
  push:
    tags:
      - 'v*'
      # This beta uses the packages uploaded manually in GitHub Releases.
      - '!v3.0.6-beta'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - name: Rename APKs
        run: |
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            name=$(basename "$f" | sed 's/app-//; s/-release//; s/.apk//')
            cp "$f" "dist/LocalBridge-${GITHUB_REF_NAME}-android-${name}.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ github.workspace }}/dist/*.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/LocalBridge-$env:GITHUB_REF_NAME-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ github.workspace }}/dist/*.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify and checksum packages
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          test -n "$(find . -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$(find . -maxdepth 1 -name '*.zip' -print -quit)"
          for package in ./*.apk ./*.zip; do
            unzip -tq "$package"
          done
          sha256sum -- *.apk *.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          generate_release_notes: true
