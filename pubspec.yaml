name: localbridge
description: "LocalBridge - yerel ağda ve onaylı oturumlarda güvenli dosya paylaşımı."
publish_to: 'none'

version: 3.0.6-beta+7

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  android_file_picker: ^2.1.3
  file_picker: ^13.3.2
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  path_provider: ^2.1.6
  path: ^1.9.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  remove_alpha_ios: true
  image_path: "assets/brand/logo.png"
  windows:
    generate: true
    image_path: "assets/brand/logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/brand/logo.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon.png
    - assets/brand/logo.png
    - assets/brand/logo_512.png
    - assets/brand/logo_mark.png
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 900
